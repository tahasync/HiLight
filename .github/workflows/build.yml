name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.9'
          architecture: x64
          cache: true

      - name: Decode Release Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          echo "::notice ::Keystore decoded ($(wc -c < android/app/release.keystore) bytes)"

      - name: Run Tests
        run: |
          flutter test

      - name: Inject Version & Build Universal APK
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            echo "::notice ::Building Tagged Release: $VERSION_NAME (Build: ${{ github.run_number }})"
            sed -i -E "s/^version: .*/version: ${VERSION_NAME}+${{ github.run_number }}/" pubspec.yaml
            flutter clean
            flutter pub get
            flutter build apk --release \
              --build-name="$VERSION_NAME" \
              --build-number=${{ github.run_number }}
          else
            echo "::notice ::Building Main Commit (Build: ${{ github.run_number }})"
            flutter clean
            flutter pub get
            flutter build apk --release \
              --build-number=${{ github.run_number }}
          fi
        env:
          KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify APK signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if jarsigner -verify "$APK" | grep -qi "jar verified"; then
            echo "::notice ::APK signature OK"
          else
            echo "::error ::APK signature verification failed"
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          overwrite: true

      - name: Generate Changelog from CHANGELOG.md or Commits
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            SECTION=$(awk -v tag="## $TAG" '$0 ~ "^"tag {found=1; next} found && /^## / {exit} found' CHANGELOG.md)
            if [ -n "$SECTION" ]; then
              echo "$SECTION" > changelog.txt
              echo "::notice ::Changelog read from CHANGELOG.md for $TAG"
              exit 0
            fi
          fi
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s" --no-merges)
          fi
          CLEAN=$(echo "$LOG" | grep -viE '^( - )?(ci:|chore:|docs:)' || true)
          if [ -z "$CLEAN" ]; then
            echo "No user-facing changes in this release" > changelog.txt
          else
            echo "$CLEAN" > changelog.txt
          fi
          echo "::notice ::Changelog generated ($(wc -l < changelog.txt) lines)"

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body_path: changelog.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
